name: EthikeSkin Policy Chain

on:
  push:
    paths:
      - 'packages/ethikeskin-ajv/ethikeskin-capacity-policy.js'
      - 'packages/ethikeskin-ajv/ethikeskin-policy-decision.js'
      - 'packages/ethikeskin-ajv/ethikeskin-policy-pipeline.js'
      - 'packages/ethikeskin-ajv/ethikeskin-enforcement-gateway.js'
      - 'packages/ethikeskin-ajv/ethikeskin-v13-query-event.js'
      - 'packages/ethikeskin-ajv/test-capacity-policy.js'
      - 'packages/ethikeskin-ajv/test-policy-decision.js'
      - 'packages/ethikeskin-ajv/test-policy-pipeline.js'
      - 'packages/ethikeskin-ajv/test-enforcement-gateway.js'
      - 'schemas/ethikeskin-v1.3-query-event-contract.json'
      - 'schemas/ethikeskin-v1.4.1-kapazitaet.schema.json'
      - 'schemas/ethikeskin-v1.4-policy-decision.schema.json'
      - '.github/workflows/capacity-policy-ci.yml'
  pull_request:
    paths:
      - 'packages/ethikeskin-ajv/**'
      - 'schemas/ethikeskin-v1.3-query-event-contract.json'
      - 'schemas/ethikeskin-v1.4.1-kapazitaet.schema.json'
      - 'schemas/ethikeskin-v1.4-policy-decision.schema.json'
      - '.github/workflows/capacity-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/ethikeskin-ajv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/ethikeskin-ajv/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Run capacity regression tests
        run: node test-capacity-policy.js
      - name: Run policy decision tests
        run: node test-policy-decision.js
      - name: Run end-to-end policy pipeline tests
        run: node test-policy-pipeline.js
      - name: Run enforcement gateway tests
        run: node test-enforcement-gateway.js
      - name: Parse JSON schemas
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('../../schemas/ethikeskin-v1.4.1-kapazitaet.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('../../schemas/ethikeskin-v1.4-policy-decision.schema.json','utf8'))"
          echo 'EthikeSkin schemas: valid JSON'
