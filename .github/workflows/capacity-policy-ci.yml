name: EthikeSkin Policy Chain

on:
  push:
    paths:
      - 'packages/ethikeskin-ajv/ethikeskin-capacity-policy.js'
      - 'packages/ethikeskin-ajv/ethikeskin-policy-decision.js'
      - 'packages/ethikeskin-ajv/test-capacity-policy.js'
      - 'packages/ethikeskin-ajv/test-policy-decision.js'
      - 'schemas/ethikeskin-v1.4.1-kapazitaet.schema.json'
      - 'schemas/ethikeskin-v1.4-policy-decision.schema.json'
      - '.github/workflows/capacity-policy-ci.yml'
  pull_request:
    paths:
      - 'packages/ethikeskin-ajv/ethikeskin-capacity-policy.js'
      - 'packages/ethikeskin-ajv/ethikeskin-policy-decision.js'
      - 'packages/ethikeskin-ajv/test-capacity-policy.js'
      - 'packages/ethikeskin-ajv/test-policy-decision.js'
      - 'schemas/ethikeskin-v1.4.1-kapazitaet.schema.json'
      - 'schemas/ethikeskin-v1.4-policy-decision.schema.json'
      - '.github/workflows/capacity-policy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run capacity regression tests
        run: node packages/ethikeskin-ajv/test-capacity-policy.js
      - name: Run policy decision tests
        run: node packages/ethikeskin-ajv/test-policy-decision.js
      - name: Parse JSON schemas
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/ethikeskin-v1.4.1-kapazitaet.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('schemas/ethikeskin-v1.4-policy-decision.schema.json','utf8'))"
          echo 'EthikeSkin schemas: valid JSON'
