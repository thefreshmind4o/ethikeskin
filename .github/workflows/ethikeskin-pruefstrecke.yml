name: EthikeSkin Pruefstrecke

on:
  push:
    paths:
      - 'packages/ethikeskin-ajv/**'
      - 'schemas/**'
      - '.github/workflows/ethikeskin-pruefstrecke.yml'
  pull_request:
    paths:
      - 'packages/ethikeskin-ajv/**'
      - 'schemas/**'
      - '.github/workflows/ethikeskin-pruefstrecke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefstrecke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: packages/ethikeskin-ajv
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/ethikeskin-ajv/package.json
      - name: Abhaengigkeiten installieren
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Kapazitaetsregelwerk pruefen
        run: node pruefung-kapazitaetsregelwerk.js
      - name: Entscheidungsobjekt pruefen
        run: node pruefung-entscheidungsobjekt.js
      - name: Entscheidungsstrecke pruefen
        run: node pruefung-entscheidungsstrecke.js
      - name: Vollzugsschleuse pruefen
        run: node pruefung-vollzugsschleuse.js
      - name: Gedaechtnis und Pruefkette pruefen
        run: node pruefung-gedaechtnis-und-pruefkette.js
      - name: Schemata einlesen
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('../../schemas/ethikeskin-v1.4.1-kapazitaet.schema.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('../../schemas/ethikeskin-v1.4-policy-decision.schema.json','utf8'))"
          echo 'EthikeSkin Schemata: gueltiges JSON'
